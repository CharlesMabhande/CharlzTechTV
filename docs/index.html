<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CharlzTechTV — Documentation</title>
  <meta name="description" content="Documentation and legal pages for CharlzTechTV.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --card: #171b24;
      --text: #e8eaef;
      --muted: #9aa3b2;
      --accent: #4f8cff;
      --border: #2a3140;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.25rem;
    }
    h1 { margin-top: 0; }
    p { color: var(--muted); }
    .links {
      display: grid;
      gap: 1rem;
      margin-top: 2rem;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      transition: border-color 0.15s ease;
    }
    a.card:hover { border-color: var(--accent); }
    a.card strong { color: #fff; display: block; margin-bottom: 0.25rem; }
    a.card span { color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CharlzTechTV</h1>
    <p>Live sports streaming for Android and Windows by CharlzTech Software Developers.</p>

    <div class="links">
      <a class="card" href="privacy-policy.html">
        <strong>Privacy Policy</strong>
        <span>How CharlzTechTV handles data — required for Google Play Store listing.</span>
      </a>
      <a class="card" href="https://github.com/CharlesMabhande/CharlzTechTV">
        <strong>GitHub Repository</strong>
        <span>Source code, builds, and project documentation.</span>
      </a>
    </div>
  </div>
</body>
</html>
